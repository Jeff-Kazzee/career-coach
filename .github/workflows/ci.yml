name: CI

on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON
        run: python -m json.tool tests/eval_queries.json > /dev/null

      - name: Compile Python
        run: python -m py_compile scripts/scorecard.py tests/test_scorecard.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
